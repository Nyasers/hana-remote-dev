# Release — 三平台构建 + 分平台直传 release 资产（对齐宿主 openhanako build.yml 的设计）
# 触发: push tag v*（version.mjs 打 tag 后自动触发）或手动 workflow_dispatch
#
# 关键设计（借鉴宿主）:
#   - matrix include + fail-fast: false（三平台互不拖累）
#   - 三 job 流水 create-release → build → verify:
#     · create-release（仅 tag 场景）: 先建 pre-release（已存在则跳过，--generate-notes）
#     · build 矩阵（needs create-release）: 各平台构建/核验/重命名后，tag 场景直接
#       gh release upload 本平台 zip + sha256（--clobber 幂等，重复推送补传不报错）；
#       dispatch 手动场景无 tag、无 release，产物走 upload-artifact 3 天窗口给人下载
#     · verify（仅 tag 场景, needs build）: 单点收尾查 release 资产三平台 zip + sha256 齐全
#   - 并发安全论证（打破原「release job 单点控制防并发覆盖」设计）:
#     资产名带平台后缀（hana-remote-dev-<ver>-<platform>.zip），三平台文件名互不相同；
#     gh release upload 对独立文件并发上传是安全的，只有同名覆盖才存在竞态，
#     平台后缀天然隔离 → 各平台构建完即传不会互相覆盖。verify 仍单点收尾，
#     保证「三平台 zip + sha256 缺一 CI fail」的硬约束不丢（防 shell 写漏/构建挂）
#   - 平台限定文件名: hana-remote-dev-<ver>-<platform>.zip（防同名不同内容互相覆盖）
#
# 与宿主的差异（必须）:
#   - 宿主 electron-builder 交叉打包（arm64 runner 出 x64）；我们的 .node 是 node-gyp
#     本机编译，无法交叉 → macOS 仅提供 Apple Silicon（macos-latest 原生 arm64）
#   - macOS Intel（macos-13 公共 runner 已退役，等不到 runner）不发布原生包：
#     Intel 用户装 arm64 包时 .node 加载失败 → ssh2 fallback 纯 JS（功能可用、性能略降），
#     或自行源码编译（npm run package 在 Intel Mac 上产出 x64 .node）
#   - node-gyp 编译由 npm ci 的 install script 完成（trustedDependencies 已放行）
#   - verify-native.mjs 魔数校验 fail-closed（防 copy-native 静默 skip → 假加速）

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # 先建 release（仅 tag 场景）: build 矩阵 needs 它，保证各平台上传时 release 必已存在。
  # dispatch 手动场景无 tag，本 job 被 if 跳过，build 照常跑（只产 artifact）。
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 自动发布为 pre-release（不占 latest 标记，稳定版本手动标记）；已存在则跳过
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, skipping create"
          else
            gh release create "${{ github.ref_name }}" \
              --prerelease \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

  build:
    needs: create-release
    # create-release 仅在 tag 场景运行，dispatch 场景会被 skip；被 needs 的 job skip 会让
    # 下游默认 if(success()) 一起 skip → 这里显式放行「非 failure」结果：
    # success（tag）/ skipped（dispatch）都继续构建，create-release 真失败则不浪费三平台构建
    if: ${{ needs.create-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
          - os: ubuntu-latest
            platform: Linux-x64
          - os: macos-latest
            platform: macOS-arm64
    runs-on: ${{ matrix.os }}
    # tag 场景 gh release upload 本平台资产需要写权限
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # node-gyp 编译需工具链：Windows（VS Build Tools）/ macOS（Xcode CLT）runner 预装；
      # ubuntu 需显式补齐
      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      # trustedDependencies 放行 ssh2/cpu-features 的 install script → node-gyp 编译 .node
      - name: Install dependencies
        run: npm ci

      # package 内部自动 build（rspack + copy-native + sha256）
      - name: Package
        run: npm run package

      # fail-closed：.node 必须存在且是本平台二进制（copy-native skip 会让 CI 红）
      - name: Verify native modules
        run: node scripts/verify-native.mjs ${{ matrix.platform }}

      - name: Rename artifacts with platform suffix
        shell: bash
        run: |
          cd releases
          ZIP=$(ls hana-remote-dev-*.zip | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::no package zip found in releases/"
            exit 1
          fi
          mv "$ZIP" "${ZIP%.zip}-${{ matrix.platform }}.zip"
          # sha256 名基于 ZIP 名构造（不能对 .zip.sha256 做 %.zip 替换，不会命中）
          mv "$ZIP.sha256" "${ZIP%.zip}-${{ matrix.platform }}.zip.sha256"
          ls -la

      # tag 场景直传本平台 zip + sha256 到 release（各平台并发上传独立文件，安全，
      # 见顶部「并发安全论证」；--clobber 幂等，重复推送/补传不报错）。
      # dispatch 手动场景无 tag 无 release，本步跳过，产物仍走下方 artifact 3 天窗口
      - name: Upload release assets (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd releases
          ZIP=$(ls hana-remote-dev-*.zip | head -1)
          [ -n "$ZIP" ] || { echo "::error::no zip to upload"; exit 1; }
          gh release upload "${{ github.ref_name }}" "$ZIP" "$ZIP.sha256" --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: hrd-${{ matrix.platform }}
          retention-days: 3
          path: releases/hana-remote-dev-*.zip*
          if-no-files-found: error

  # 单点收尾（仅 tag 场景）: 查 release 资产三平台 zip + sha256 齐全，缺则删 release 并 fail
  verify:
    needs: [create-release, build]
    # build 任一平台失败也进 verify → 资产不全即删 release，公开 release 不留残缺
    # （与旧单点设计同保证）；create-release 失败时跳过（失败已由它自己报出，避免二次误报）
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # 硬约束：三平台 zip + sha256 必须齐全，缺一个 CI fail（draft 留给人手动检查）。
      # 直接查 release 资产（gh release view --json assets），无需 download-artifact
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ASSETS=$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name')
          echo "=== Release assets ==="
          echo "$ASSETS"
          echo ""
          MISSING=()
          for P in Windows-x64 Linux-x64 macOS-arm64; do
            # 平台后缀匹配（版本段通配 [0-9.]+：tag 名 v0.6.3 带 v 前缀，
            # 与 manifest version 0.6.3 不一致，不能用 github.ref_name 拼资产名）
            echo "$ASSETS" | grep -qE "^hana-remote-dev-[0-9.]+-$P\.zip$" || MISSING+=("$P.zip")
            echo "$ASSETS" | grep -qE "^hana-remote-dev-[0-9.]+-$P\.zip\.sha256$" || MISSING+=("$P.zip.sha256")
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required release assets:"
            printf '  %s\n' "${MISSING[@]}"
            # 公开 release 不留残缺：verify 失败即删除，下次重跑时重建
            gh release delete "${{ github.ref_name }}" --yes
            exit 1
          fi
          echo "All required assets present ✓"
